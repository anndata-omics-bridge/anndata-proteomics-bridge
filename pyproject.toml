[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anndata-proteomics"
version = "0.1.0"
description = "Convert proteomics software output to AnnData format"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Witold Wolski", email = "wew@fgcz.ethz.ch"}
]
keywords = ["proteomics", "anndata", "mass-spectrometry", "diann", "maxquant"]

dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "anndata",
    "mudata",
    "pyarrow",
    "pyyaml",
    "packaging",
    "requests",
    "beautifulsoup4",
    "cyclopts",
    "pydantic>=2",
    "loguru",
    "prozor>=0.1.0",
]

[project.scripts]
apb = "anndata_proteomics.scripts.cli:main"
apb-testdata = "anndata_proteomics.scripts.extract_raw_file_db:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "deptry>=0.24,<1",
    "ruff",
    "pyright",
    "pandas-stubs",
    "scipy-stubs",
    "jsonschema>=4",
    "pre-commit",
    # Exercise Prozor's optional Rust backend in APB's integration tests.
    "prozor[fast]>=0.1.0",
]
# Optional faster Aho-Corasick backend supplied by Prozor.
fast = [
    "prozor[fast]>=0.1.0",
]

[dependency-groups]
docs = [
    "mkdocs-material>=9.5",
]

[tool.uv.sources]
# Reproducible source until Prozor is released on a package index. Built APB
# distributions retain the portable registry requirement (`prozor>=0.1.0`).
prozor = { git = "https://github.com/anndata-omics-bridge/prozor.git", rev = "0cf5875ac7730fab68d30fac411553ff580df883" }

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

# Strictest practical pyright, modelled on prozor / python_package_template.
# See TODO/TODO_pyright.md for the completed burn-down and enforcement policy.
[tool.pyright]
include = ["src", "tests"]
executionEnvironments = [
    { root = "tests", reportPrivateUsage = "none" },
    { root = "src" },
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportImportCycles = "error"
reportMissingTypeStubs = "none"
reportUnnecessaryTypeIgnoreComment = "error"
reportImplicitOverride = "error"
enableTypeIgnoreComments = false
# Third-party scientific libraries expose incomplete types even with their
# canonical stub packages. Keep strict first-party checks while suppressing
# diagnostics whose only signal is a propagated Unknown.
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"

[tool.deptry]
known_first_party = ["anndata_proteomics"]
optional_dependencies_dev_groups = ["dev"]

[tool.deptry.per_rule_ignores]
# pandas loads this declared Parquet engine dynamically, so no direct Python
# import exists for Deptry to observe.
DEP002 = ["pyarrow"]

[tool.deptry.package_module_name_map]
mkdocs-material = "material"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: mark test as integration test (requires network)",
]
