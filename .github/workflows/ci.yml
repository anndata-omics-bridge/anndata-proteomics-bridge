name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DIFF_COVER_BASE: ${{ github.base_ref && format('origin/{0}', github.base_ref) || 'main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Sync locked environment
        run: uv sync --frozen --extra dev --group docs

      - name: Run pre-commit checks
        run: uv run --no-sync pre-commit run --hook-stage pre-commit --all-files

      - name: Run pre-push checks
        run: uv run --no-sync pre-commit run --hook-stage pre-push --all-files
